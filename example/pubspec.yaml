name: flutter_syntax_highlight_example
description: "flutter_syntax_highlight의 한 화면짜리 예제."
# `resolution: workspace`를 쓰지 않는다. 한 번 썼다가 뺐다 — 그것을 넣은 이유가
# "루트 `flutter analyze`가 example까지 보게 한다"였는데 **거짓이었다.** analyze는
# 워크스페이스가 아니라 트리를 걷고, 워크스페이스를 지워도 똑같이 잡는다(측정함).
# 그리고 이 pubspec은 배포 아카이브에 실리므로, `resolution:`이 남아 있으면
# pub cache에서 예제를 떠 간 사람의 `pub get`이 "found no workspace root"로 죽는다.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_syntax_highlight:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
