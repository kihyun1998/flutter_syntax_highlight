name: flutter_syntax_highlight_example
description: "flutter_syntax_highlight의 한 화면짜리 예제."
publish_to: none
version: 1.0.0

# 루트 패키지와 한 워크스페이스로 묶는다. 그래야 루트에서 돌리는
# `flutter analyze`가 이 예제까지 본다 — 따로 두면 예제가 깨져도 게이트가 조용하다.
resolution: workspace

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_syntax_highlight:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
