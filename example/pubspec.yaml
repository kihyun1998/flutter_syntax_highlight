name: flutter_syntax_highlight_example
description: "A one-screen example of flutter_syntax_highlight."
# `resolution: workspace` is not used. It was used once and taken out — the
# reason for adding it was "it makes the root `flutter analyze` look at example
# too", and that **was false.** analyze walks the tree, not the workspace, and
# catches the same with the workspace removed (measured).
# And this pubspec ships in the published archive, so if `resolution:` stayed,
# `pub get` for anyone who lifted the example out of the pub cache would die
# with "found no workspace root".
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_syntax_highlight:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
