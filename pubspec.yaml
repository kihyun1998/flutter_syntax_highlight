name: flutter_syntax_highlight
description: >-
  Dart-only syntax highlighting in two layers: a pure-Dart tokenizer underneath
  and a thin widget on top. The tokens rejoin into the exact input, byte for byte.
version: 0.4.0
homepage: https://github.com/kihyun1998/flutter_syntax_highlight
repository: https://github.com/kihyun1998/flutter_syntax_highlight
issue_tracker: https://github.com/kihyun1998/flutter_syntax_highlight/issues

topics:
  - syntax-highlighting
  - tokenizer
  - code
  - text
  - widget

# The lower bound is flutter_smooth_wheel_scroll's. It requires Flutter 3.32 /
# Dart 3.8, so writing anything lower would be false.
environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_smooth_wheel_scroll: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# There is no `flutter:` section. With no assets and no fonts only an empty key
# would be left, and an empty key reads as if something had been there and was
# deleted.

screenshots:
  - description: >-
      The example app in light mode. The default palette is derived from the
      app's ColorScheme, and the swatches in the bar change the seed it
      derives from.
    path: screenshots/light.png
  - description: >-
      The same screen in dark mode. The default palette is derived, so it is
      right in both with nothing to configure.
    path: screenshots/dark.png
  - description: >-
      The oneDark preset in a light app. A named preset carries the background
      its colours were chosen against.
    path: screenshots/preset-one-dark.png
