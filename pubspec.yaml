name: flutter_syntax_highlight
description: >-
  Dart-only syntax highlighting in two layers: a pure-Dart tokenizer underneath
  and a thin widget on top. The tokens rejoin into the exact input, byte for byte.
version: 0.1.0
homepage: https://github.com/kihyun1998/flutter_syntax_highlight
repository: https://github.com/kihyun1998/flutter_syntax_highlight
issue_tracker: https://github.com/kihyun1998/flutter_syntax_highlight/issues

topics:
  - syntax-highlighting
  - tokenizer
  - code
  - text
  - widget

# 예제를 같은 워크스페이스에 둔다. 루트에서 돌리는 `flutter analyze`가
# example/까지 보게 하려는 것이다 — 따로 두면 예제가 깨져도 게이트가 조용하다.
workspace:
  - example

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # ^6.0.0은 `sdk: ^3.8.0`을 요구하므로 위에 선언한 하한 3.6.0을 거짓으로
  # 만든다. ^5.0.0은 ^3.5.0을 요구해 하한과 맞고, 참조 repo가 쓰는 것과도 같다.
  flutter_lints: ^5.0.0

flutter:
