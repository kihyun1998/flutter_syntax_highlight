include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # The reference snapshot. It is not part of the package, and it imports
    # `package:example/...`, so it does not compile here. Leaving it untouched
    # is the point, so it is excluded from analysis too — see
    # reference/README.md.
    - reference/**
    - build/**

    # The six lines below point at directories that do not exist in this
    # package. Delete them and `flutter pub get` puts them back every time
    # (measured). The tool owns them, so they stay.
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
